# =============================================================================
# MiniBank — Docker Compose (local development)
# =============================================================================
# Brings up the full stack: PostgreSQL, RabbitMQ, and all 4 microservices.
#
# Usage:
#   docker compose up --build            # build images and start everything
#   docker compose up --build -d         # same, but detached
#   docker compose down -v               # stop and remove volumes (clean slate)
#   docker compose logs -f api-gateway   # tail a single service
#
# The services start in dependency order via `depends_on` + health checks:
#   postgres & rabbitmq  →  iam-service & wallet-service  →  api-gateway
#   rabbitmq             →  notification-service
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Infrastructure: PostgreSQL
  # ---------------------------------------------------------------------------
  # Single Postgres instance with two databases (iam_db, wallet_db).
  # The init script in ./infra/postgres/ creates both databases and users
  # on first launch. Data is persisted in the `pgdata` volume.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Infrastructure: RabbitMQ
  # ---------------------------------------------------------------------------
  # Management UI available at http://localhost:15672 (guest/guest).
  # The `transfers` fanout exchange is declared by the Wallet publisher and
  # Notification consumer at startup — no manual setup needed.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Service: IAM (port 8001)
  # ---------------------------------------------------------------------------
  # User registration, login, JWT issuance and validation.
  # Depends on PostgreSQL only.
  # ---------------------------------------------------------------------------
  iam-service:
    build:
      context: ./iam-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://iam_user:iam_pass@postgres:5432/iam_db
      JWT_SECRET_KEY: local-dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: "60"
      BCRYPT_ROUNDS: "12"
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Service: Wallet / Ledger (port 8002)
  # ---------------------------------------------------------------------------
  # Account balances, fund transfers, double-entry ledger.
  # Depends on PostgreSQL and RabbitMQ.
  # ---------------------------------------------------------------------------
  wallet-service:
    build:
      context: ./wallet-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet_user:wallet_pass@postgres:5432/wallet_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      TRANSFER_EXCHANGE_NAME: transfers
      APP_HOST: 0.0.0.0
      APP_PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Service: Notification (port 8003)
  # ---------------------------------------------------------------------------
  # Consumes transfer events from RabbitMQ, logs mock notifications.
  # Depends on RabbitMQ only — no database.
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      TRANSFER_EXCHANGE_NAME: transfers
      NOTIFICATION_QUEUE_NAME: notification.transfers
      APP_HOST: 0.0.0.0
      APP_PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Service: API Gateway (port 8000)
  # ---------------------------------------------------------------------------
  # Single entry point for all client requests. Proxies to IAM and Wallet.
  # Starts last — depends on IAM and Wallet being up.
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      IAM_SERVICE_URL: http://iam-service:8001
      WALLET_SERVICE_URL: http://wallet-service:8002
      RATE_LIMIT_REGISTER: 10/minute
      RATE_LIMIT_LOGIN: 20/minute
      HTTP_TIMEOUT: "10.0"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      iam-service:
        condition: service_started
      wallet-service:
        condition: service_started

volumes:
  pgdata:
